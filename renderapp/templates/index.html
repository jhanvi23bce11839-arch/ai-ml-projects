<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Recommendation System</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            font-family:'Poppins',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#F8F2FF,#EFE4FF);
            min-height:100vh;
        }

        .container{
            margin-top:60px;
        }

        .card{
            border:none;
            border-radius:25px;
            padding:40px;
            background:white;
            box-shadow:0 12px 35px rgba(0,0,0,0.15);
        }

        h1{
            color:#8E44AD;
            font-size:48px;
            font-weight:700;
            text-align:center;
            margin-bottom:35px;
        }

        .emoji{
            font-size:48px;
            margin-right:12px;
        }

        .form-control{
            height:58px;
            font-size:18px;
            border-radius:12px 0 0 12px;
            border:2px solid #D8B4F8;
        }

        .form-control:focus{
            border-color:#A855F7;
            box-shadow:none;
        }

        .btn-custom{
            background:#C084FC;
            color:white;
            font-size:18px;
            font-weight:600;
            border:none;
            border-radius:0 12px 12px 0;
            width:170px;
        }

        .btn-custom:hover{
            background:#A855F7;
            color:white;
        }

        h3{
            color:#8E44AD;
            margin-top:35px;
            margin-bottom:20px;
            font-weight:600;
        }

        ul{
            list-style:none;
            padding:0;
        }

        li{
            background:#F7EEFF;
            color:#5B2C6F;
            padding:15px;
            margin-bottom:12px;
            border-radius:12px;
            font-size:18px;
            font-weight:500;
            transition:0.3s;
        }

        li:hover{
            transform:translateX(8px);
            background:#EAD7FF;
        }

        footer{
            text-align:center;
            margin-top:30px;
            color:#8E44AD;
            font-size:14px;
        }

    </style>

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card">

<h1>
<span class="emoji">🍿</span>
Movie Recommendation System
</h1>

<form method="POST">

<div class="input-group">

<input
type="text"
class="form-control"
name="movie"
placeholder="Enter a movie name..."
required>

<button
class="btn btn-custom"
type="submit">
Recommend
</button>

</div>

</form>

{% if recommendations %}

<h3>✨ Recommended Movies</h3>

<ul>

{% for movie in recommendations %}

<li>🎬 {{ movie }}</li>

{% endfor %}

</ul>

{% endif %}

<footer>

Made with ❤️ using Flask & Machine Learning

</footer>

</div>

</div>

</div>

</div>

</body>

</html>
